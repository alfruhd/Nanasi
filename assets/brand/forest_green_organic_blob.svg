      <stop offset="0%" stop-color="#1A6B4D" />
      <stop offset="50%" stop-color="#14563E" />
      <stop offset="100%" stop-color="#0E422D" />
    </linearGradient>

    <!-- Refined Luminous Edge Stroke -->

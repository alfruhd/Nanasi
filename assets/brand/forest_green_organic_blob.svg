      <stop offset="0%" stop-color="#34B782" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#249666" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#C89B3C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E7A53" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Clean Depth Shadow on the shape boundary itself -->
    <filter id="cleanShapeDepth" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

